site_name: Jarvis Automation Docs
site_description: Install, use and extend Jarvis Automation, the self-hosted voice assistant
site_url: https://docs.jarvisautomation.dev
repo_url: https://github.com/alexberardi/jarvis-server
repo_name: jarvis-server
dev_addr: 0.0.0.0:7730

extra:
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/9SuQFVexxJ
      name: Join the Jarvis Discord
    - icon: fontawesome/brands/github
      link: https://github.com/alexberardi/jarvis-server
      name: Jarvis Automation on GitHub

theme:
  name: material
  # B · Quiet Violet: the CSS owns the colours (assets/stylesheets/theme.css maps B's
  # tokens onto Material's variables for both schemes), so the palette is custom/custom.
  # font: false keeps the system font stacks; nothing is fetched.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  favicon: assets/images/favicon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github
  custom_dir: docs/overrides

extra_css:
  - assets/stylesheets/theme.css
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.mark
  # Renders `:fontawesome-brands-discord:` / `:material-*:` icon shortcodes as
  # SVGs (used by the homepage hero buttons + footer social links). Without this
  # they render as literal text. Path is material.extensions.emoji (Material 9.4+).
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

# Files the site serves outside docs/ (AASA, _headers, _redirects, /app/* fallback) and
# the redirects for moved pages (redirects.yml) are written by these hooks at build time.
hooks:
  - hooks/root_files.py
  - hooks/redirects.py

